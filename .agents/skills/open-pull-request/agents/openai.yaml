interface:
  display_name: "Pull Request와 완료"
  short_description: "PR부터 same-repo squash·보존 정리까지 검증"
  default_prompt: "$open-pull-request를 사용해 현재 이슈 브랜치의 PR을 검증해 작성하고, 완료·병합 요청이면 same-repository origin, exact Git head, 전체 CI·thread snapshot과 squash topology를 재검증해 병합·완료·OMC sealed snapshot generation과 mutable root·metadata append-only quarantine 정리를 진행해 주세요."
