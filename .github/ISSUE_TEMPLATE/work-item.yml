name: MVP 작업
description: AI 작업자가 독립적으로 구현하고 검증할 수 있는 작업 단위
title: "[MVP] "
labels:
  - "status:todo"
body:
  - type: markdown
    attributes:
      value: |
        한 이슈에는 독립적으로 병합 가능한 결과 하나만 작성합니다.
        생성 후 선행 작업은 GitHub 기본 의존 관계로 반드시 연결합니다.

  - type: textarea
    id: overview
    attributes:
      label: 개요
      description: 이 작업이 무엇을 만드는지 한 단락으로 요약합니다.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 맥락
      description: 현재 문제, 사용자 영향과 이 작업이 필요한 이유를 설명합니다.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 완료 후 관찰할 수 있는 결과 하나를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함하는 작업과 의도적으로 제외하는 작업을 구분합니다.
      placeholder: |
        포함:
        -

        제외:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 구역을 행동 시나리오의 정본으로 사용합니다. 관찰 가능한 Given/When/Then 또는 조건/행동/결과로 happy·error·recovery path를 다루고, 각 시나리오에 추적 ID와 검증 계획을 연결합니다.
      placeholder: |
        Happy path
        - 조건(Given):
        - 행동(When):
        - 결과(Then):
        - 추적 ID:
        - 검증 계획:

        Error path
        - 조건(Given):
        - 행동(When):
        - 결과(Then):
        - 추적 ID:
        - 검증 계획:

        Recovery path
        - 조건(Given):
        - 행동(When):
        - 결과(Then):
        - 추적 ID:
        - 검증 계획:
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: 선행 작업
      description: 선행 이슈와 필요한 이유를 적습니다. 없음도 명시합니다.
    validations:
      required: true

  - type: textarea
    id: traceability
    attributes:
      label: 추적성
      description: 완료 조건의 각 행동 시나리오에 PRD-NN-FR-NN, PRD-NN-AC-NN, PRD-NN-SP-NN 또는 POL-NN-R-NN을 연결합니다. 같은 이슈·PR에서 새 ID를 정의하면 정확한 예상 ID 뒤에 "planned — 이 PR에서 정의"를 적고 Ready 전 exact head 정본 검증을 계획합니다.
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: 변경 허용 경로
      description: 저장소 기준의 좁은 경로나 경로 패턴을 작성합니다. 새 PRD·Policy ID를 같은 PR에서 정의하면 namespace 번호가 일치하는 구체적 docs/**/NN_*.md 정본 파일과 필요한 인덱스 경로를 반드시 포함합니다. README나 재귀 glob만으로는 정의 파일을 소유하지 않습니다.
    validations:
      required: true

  - type: textarea
    id: forbidden_paths
    attributes:
      label: 변경 금지 경로
      description: 겹치는 병렬 작업과 공용 계약을 보호할 경로를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증
      description: 완료 조건의 happy·error·recovery 시나리오별 명령·관찰 방법과 증거, 위험도에 맞는 독립 리뷰 인원·관점을 계획합니다.
    validations:
      required: true

  - type: textarea
    id: document_impact
    attributes:
      label: 문서 영향
      description: 검토할 PRD·정책 또는 제품 동작이 바뀌지 않는 근거를 작성합니다. planned ID가 있으면 같은 branch에서 만들 정본 파일과 Ready 전 validator로 ID 존재를 확인할 계획을 적습니다.
    validations:
      required: true
