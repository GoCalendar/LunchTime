name: 저장소 작업 도구 검증

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 결정적 스크립트 구문 검사
        run: |
          node --check .agents/skills/update-product-docs/scripts/validate-product-docs.mjs
          node --check .agents/skills/update-product-docs/scripts/validate-product-docs.test.mjs
          node --check .agents/skills/update-product-docs/scripts/product-contract-ids.mjs
          node --check .agents/skills/update-product-docs/scripts/product-contract-ids.test.mjs
          node --check .agents/skills/run-github-work-item/scripts/work-item.mjs
          node --check .agents/skills/run-github-work-item/scripts/work-item.test.mjs
          node --check .agents/skills/run-github-work-item/scripts/bootstrap-mvp.mjs
          node --check .agents/skills/run-github-work-item/scripts/bootstrap-mvp.test.mjs
          node --check .agents/skills/commit-work-item/scripts/validate-commit-message.mjs
          node --check .agents/skills/commit-work-item/scripts/validate-commit-message.test.mjs
          node --check .agents/skills/commit-work-item/scripts/validate-commit-paths.mjs
          node --check .agents/skills/commit-work-item/scripts/validate-commit-paths.test.mjs
          node --check .agents/skills/open-pull-request/scripts/validate-pr-body.mjs
          node --check .agents/skills/open-pull-request/scripts/validate-pr-body.test.mjs
          node --check .agents/skills/open-pull-request/scripts/validate-finalize.mjs
          node --check .agents/skills/open-pull-request/scripts/validate-finalize.test.mjs
          node --check .agents/skills/open-pull-request/scripts/finalize-merge.mjs
          node --check .agents/skills/open-pull-request/scripts/finalize-merge.test.mjs
          node --check .agents/skills/open-pull-request/scripts/finalize-remote-branch.mjs
          node --check .agents/skills/open-pull-request/scripts/finalize-remote-branch.test.mjs
          node --check .agents/skills/open-pull-request/scripts/finalize-local-cleanup.mjs
          node --check .agents/skills/open-pull-request/scripts/finalize-local-cleanup.test.mjs

      - name: 작업 도구 회귀 테스트 실행
        run: |
          node --test .agents/skills/update-product-docs/scripts/product-contract-ids.test.mjs
          node --test .agents/skills/update-product-docs/scripts/validate-product-docs.test.mjs
          node --test .agents/skills/run-github-work-item/scripts/work-item.test.mjs
          node --test .agents/skills/run-github-work-item/scripts/bootstrap-mvp.test.mjs
          node --test .agents/skills/commit-work-item/scripts/validate-commit-message.test.mjs
          node --test .agents/skills/commit-work-item/scripts/validate-commit-paths.test.mjs
          node --test .agents/skills/open-pull-request/scripts/validate-pr-body.test.mjs
          node --test .agents/skills/open-pull-request/scripts/validate-finalize.test.mjs
          node --test .agents/skills/open-pull-request/scripts/finalize-merge.test.mjs
          node --test .agents/skills/open-pull-request/scripts/finalize-remote-branch.test.mjs
          node --test .agents/skills/open-pull-request/scripts/finalize-local-cleanup.test.mjs

      - name: 커밋 경로 검증
        run: |
          node .agents/skills/commit-work-item/scripts/validate-commit-paths.mjs \
            --index

      - name: PR 템플릿 검증
        run: |
          node .agents/skills/open-pull-request/scripts/validate-pr-body.mjs \
            --template .github/PULL_REQUEST_TEMPLATE.md

      - name: PR 제목·본문·브랜치 검증
        if: github.event_name == 'pull_request'
        run: |
          node .agents/skills/open-pull-request/scripts/validate-pr-body.mjs \
            --event "$GITHUB_EVENT_PATH"

      - name: 커밋 메시지 검증
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node .agents/skills/commit-work-item/scripts/validate-commit-message.mjs \
            --range "${BASE_SHA}..${HEAD_SHA}"

      - name: MVP 작업 이슈 매니페스트 검증
        run: node .agents/skills/run-github-work-item/scripts/bootstrap-mvp.mjs validate

      - name: 제품 문서 검증
        run: node .agents/skills/update-product-docs/scripts/validate-product-docs.mjs

      - name: 패치 공백 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"
