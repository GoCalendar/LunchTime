name: 제품 문서 검증

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 제품 문서 검증
        run: node .agents/skills/update-product-docs/scripts/validate-product-docs.mjs

      - name: 패치 공백 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"
