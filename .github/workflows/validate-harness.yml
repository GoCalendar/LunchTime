name: 저장소 작업 도구 검증

on:
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 이 job id는 GitHub ruleset의 required check 이름이다.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: exact head 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: exact head 확인
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "checkout HEAD가 검증 대상 SHA와 다릅니다."
            echo "expected=$EXPECTED_SHA"
            echo "actual=$ACTUAL_SHA"
            exit 1
          fi

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 변경 경로 고정
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff \
              --name-only \
              --diff-filter=ACDMRT \
              -z \
              --no-ext-diff \
              --no-renames \
              "${BASE_SHA}...${EXPECTED_SHA}" \
              -- > "$RUNNER_TEMP/changed-paths"
          else
            git ls-files -z > "$RUNNER_TEMP/changed-paths"
          fi

      - name: 패치 공백 검사
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${BASE_SHA}...${EXPECTED_SHA}"
          else
            git show --check --format= "$EXPECTED_SHA"
          fi

      - name: 커밋 메시지 검증
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${EXPECTED_SHA}"
          else
            RANGE="${EXPECTED_SHA}^..${EXPECTED_SHA}"
          fi
          node .agents/skills/commit-work-item/scripts/validate-commit-message.mjs \
            --range "$RANGE"

      - name: 커밋 경로 검증
        run: |
          node .agents/skills/commit-work-item/scripts/validate-commit-paths.mjs \
            --index

      - name: 관련 validator 실행
        run: |
          product_docs=false
          work_item=false
          pr_template=false

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            product_docs=true
            work_item=true
            pr_template=true
          fi

          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              AGENTS.md|CONTRIBUTING.md|README.md|docs/prd/*|docs/policies/*|docs/architecture/*|docs/development/*)
                product_docs=true
                ;;
              .agents/skills/update-product-docs/*|.agents/skills/*/SKILL.md|.agents/skills/*/references/*.md|.github/ISSUE_TEMPLATE/*|.github/workflows/*)
                product_docs=true
                ;;
            esac

            case "$changed_path" in
              .github/mvp-work-items.json|.github/work-management.json|.github/ISSUE_TEMPLATE/work-item.yml|.agents/skills/run-github-work-item/scripts/bootstrap-mvp.mjs)
                work_item=true
                ;;
            esac

            case "$changed_path" in
              .github/PULL_REQUEST_TEMPLATE.md|.agents/skills/open-pull-request/scripts/validate-pr-body.mjs)
                pr_template=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"

          if [ "$product_docs" = true ]; then
            node .agents/skills/update-product-docs/scripts/validate-product-docs.mjs
          fi
          if [ "$work_item" = true ]; then
            node .agents/skills/run-github-work-item/scripts/bootstrap-mvp.mjs validate
          fi
          if [ "$pr_template" = true ]; then
            node .agents/skills/open-pull-request/scripts/validate-pr-body.mjs \
              --template .github/PULL_REQUEST_TEMPLATE.md
          fi

      - name: 변경된 도구의 관련 테스트 실행
        shell: bash
        run: |
          declare -A selected_tests=()
          declare -A syntax_only=()
          declare -A deleted_tools=()

          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              .agents/skills/*/scripts/*.test.mjs|.github/workflows/*.test.mjs)
                if [ -f "$changed_path" ]; then
                  selected_tests["$changed_path"]=1
                else
                  paired_source="${changed_path%.test.mjs}.mjs"
                  if [ -f "$paired_source" ]; then
                    syntax_only["$paired_source"]=1
                  else
                    deleted_tools["$(basename "$changed_path")"]=1
                  fi
                fi
                ;;
              .agents/skills/*/scripts/*.mjs|.github/workflows/*.mjs)
                paired_test="${changed_path%.mjs}.test.mjs"
                if [ -f "$paired_test" ]; then
                  selected_tests["$paired_test"]=1
                elif [ -f "$changed_path" ]; then
                  syntax_only["$changed_path"]=1
                else
                  deleted_tools["$(basename "$changed_path")"]=1
                fi
                ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"

          if [ "${#deleted_tools[@]}" -gt 0 ]; then
            mapfile -t deleted_names < <(
              printf '%s\n' "${!deleted_tools[@]}" | LC_ALL=C sort
            )
            for deleted_name in "${deleted_names[@]}"; do
              if git grep -n -F -- "$deleted_name"; then
                echo "삭제된 도구의 잔존 참조가 있습니다: $deleted_name"
                exit 1
              fi
            done
          fi

          if [ "${#syntax_only[@]}" -gt 0 ]; then
            mapfile -t syntax_files < <(
              printf '%s\n' "${!syntax_only[@]}" | LC_ALL=C sort
            )
            for syntax_file in "${syntax_files[@]}"; do
              node --check "$syntax_file"
            done
          fi

          if [ "${#selected_tests[@]}" -gt 0 ]; then
            mapfile -t test_files < <(
              printf '%s\n' "${!selected_tests[@]}" | LC_ALL=C sort
            )
            node --test "${test_files[@]}"
          else
            echo "변경된 도구에 대응하는 테스트가 없습니다."
          fi
