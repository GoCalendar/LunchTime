name: PR 메타데이터 검증

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 이 job id는 GitHub ruleset의 required check 이름이다.
  pr-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: exact head 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: exact head 확인
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "checkout HEAD가 검증 대상 SHA와 다릅니다."
            echo "expected=$EXPECTED_SHA"
            echo "actual=$ACTUAL_SHA"
            exit 1
          fi

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: live PR 입력 조회
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{
              pull_request: {
                title: .title,
                body: .body,
                draft: .draft,
                head: {ref: .head.ref, sha: .head.sha},
                base: {ref: .base.ref}
              }
            }' > "${RUNNER_TEMP}/live-pr.json"

      - name: PR 제목·본문·브랜치 검증
        run: |
          node .agents/skills/open-pull-request/scripts/validate-pr-body.mjs \
            --event "${RUNNER_TEMP}/live-pr.json"
