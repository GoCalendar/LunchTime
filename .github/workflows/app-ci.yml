name: macOS 앱 검증

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      full: ${{ steps.paths.outputs.full }}
      reason: ${{ steps.paths.outputs.reason }}
      changed_paths_json: ${{ steps.paths.outputs.changed_paths_json }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 고정
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 경로 classifier 자체 검증
        run: |
          node --check .github/workflows/validate-app-paths.mjs
          node --check .github/workflows/validate-app-paths.test.mjs
          node --test .github/workflows/validate-app-paths.test.mjs

      - name: 변경 경로 분류
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha || '' }}
        run: |
          node .github/workflows/validate-app-paths.mjs \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"

  app-build:
    needs: classify
    if: ${{ needs.classify.outputs.app == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # runner 이미지 기본값은 Xcode 16.4이므로 명시하지 않으면 로컬과 다른 SDK로
      # 컴파일된다. 개발 기준과 같은 버전을 고정해 게이트를 결정적으로 만든다.
      # 이미지에서 이 버전이 제거되면 아래 단계가 실패하며, 그때 지원 버전을
      # 다시 정한다.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: 도구 버전 고정 확인
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "고정한 Xcode를 찾을 수 없습니다: $DEVELOPER_DIR"
            echo "이 runner 이미지에 설치된 Xcode:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos
          swift --version

      - name: 앱 빌드
        run: |
          xcodebuild build \
            -project LunchTime.xcodeproj \
            -scheme LunchTime \
            -destination 'platform=macOS'

      # UI 테스트는 automation mode 권한과 앱 실행 타이밍에 의존해 결정적이지
      # 않으므로 실행에서 제외한다. 기본 scheme도 이미 제외하지만 scheme이 바뀌어도
      # 게이트가 결정적으로 유지되도록 여기서 한 번 더 제외한다. 대상은 계속
      # 빌드되므로 컴파일 회귀는 잡는다. BDD/ATDD 테스트 표준도 E2E를 MVP 필수
      # 게이트로 두지 않는다.
      - name: 앱 테스트
        run: |
          xcodebuild test \
            -project LunchTime.xcodeproj \
            -scheme LunchTime \
            -destination 'platform=macOS' \
            -skip-testing:LunchTimeUITests \
            -resultBundlePath "${{ runner.temp }}/LunchTime.xcresult"

      - name: Release 구성 빌드
        run: |
          xcodebuild build \
            -project LunchTime.xcodeproj \
            -scheme LunchTime \
            -configuration Release \
            -destination 'platform=macOS'

      - name: 실패 진단 자료 업로드
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lunchtime-xcresult-${{ github.run_id }}
          path: ${{ runner.temp }}/LunchTime.xcresult
          retention-days: 14
          if-no-files-found: ignore

  # job id가 곧 GitHub check 이름이 된다. ruleset의 필수 검사 `app-test`는
  # macOS 실행 여부와 실제 결과를 대조하는 이 빠른 결론 job에 연결한다.
  app-test:
    if: ${{ always() }}
    needs:
      - classify
      - app-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: 선택 결과와 실행 결과 결속
        env:
          APP_SELECTED: ${{ needs.classify.outputs.app }}
          FULL_SELECTED: ${{ needs.classify.outputs.full }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          APP_BUILD_RESULT: ${{ needs.app-build.result }}
        run: node .github/workflows/validate-app-paths.mjs --verify-results
