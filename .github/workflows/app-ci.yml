name: macOS 앱 검증

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # job id가 곧 GitHub check 이름이 된다. ruleset의 필수 검사로 등록할 때 이
  # 이름을 사용하므로 `name:`을 붙이지 않는다.
  app-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: 도구 버전 기록
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos
          swift --version

      - name: 앱 빌드
        run: |
          xcodebuild build \
            -project LunchTime.xcodeproj \
            -scheme LunchTime \
            -destination 'platform=macOS'

      # UI 테스트는 automation mode 권한과 앱 실행 타이밍에 의존해 결정적이지
      # 않으므로 실행에서 제외한다. 기본 scheme도 이미 제외하지만 scheme이 바뀌어도
      # 게이트가 결정적으로 유지되도록 여기서 한 번 더 제외한다. 대상은 계속
      # 빌드되므로 컴파일 회귀는 잡는다. BDD/ATDD 테스트 표준도 E2E를 MVP 필수
      # 게이트로 두지 않는다.
      - name: 앱 테스트
        run: |
          xcodebuild test \
            -project LunchTime.xcodeproj \
            -scheme LunchTime \
            -destination 'platform=macOS' \
            -skip-testing:LunchTimeUITests \
            -resultBundlePath "${{ runner.temp }}/LunchTime.xcresult"

      - name: Release 구성 빌드
        run: |
          xcodebuild build \
            -project LunchTime.xcodeproj \
            -scheme LunchTime \
            -configuration Release \
            -destination 'platform=macOS'

      - name: 실패 진단 자료 업로드
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lunchtime-xcresult-${{ github.run_id }}
          path: ${{ runner.temp }}/LunchTime.xcresult
          retention-days: 14
          if-no-files-found: ignore
